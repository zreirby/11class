<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090a10" />
  <title>Выбор задания • Физика</title>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #090a10;
      --surface-card: rgba(18, 22, 34, 0.72);
      --surface-elevated: rgba(26, 32, 48, 0.85);
      --surface-badge: rgba(99, 102, 241, 0.14);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;

      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);

      --border: rgba(255, 255, 255, 0.08);
      --radius-xl: 24px;
      --radius-lg: 16px;
      --radius-md: 12px;

      --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      --mono: "JetBrains Mono", monospace;
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: var(--font);
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: clip;
      position: relative;
    }

    /* Фиксированный фон без лагов на мобильных устройствах */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.14) 0px, transparent 50%),
        radial-gradient(at 100% 20%, rgba(139, 92, 246, 0.11) 0px, transparent 50%),
        radial-gradient(at 50% 85%, rgba(236, 72, 153, 0.08) 0px, transparent 50%);
    }

    /* Шапка */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 10, 16, 0.78);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      text-align: center;
    }

    .header-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.01em;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Главный контейнер */
    main {
      max-width: 620px;
      width: 100%;
      margin: 0 auto;
      padding: 36px 20px 56px;
    }

    .hero {
      text-align: center;
      margin-bottom: 32px;
    }

    .hero h1 {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-sub);
    }

    /* Карточка меню */
    .menu-card {
      background: var(--surface-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      padding: 28px;
      text-align: center;
    }

    .card-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.25);
      padding: 4px 14px;
      border-radius: 30px;
      margin-bottom: 22px;
    }

    /* Вертикальный список длинных кнопок */
    .buttons-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Длинная кнопка-ссылка */
    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      text-decoration: none;
      padding: 16px 20px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      transition: transform 0.3s var(--ease-spring), border-color 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .nav-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--accent-gradient);
      opacity: 0;
      transition: opacity 0.3s var(--ease-spring);
      z-index: 0;
    }

    .nav-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .nav-btn:active {
      transform: scale(0.985);
      border-color: rgba(99, 102, 241, 0.45);
    }

    .btn-left {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .btn-num {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-md);
      background: var(--surface-badge);
      border: 1px solid rgba(99, 102, 241, 0.25);
      font-size: 20px;
      font-weight: 800;
      font-family: var(--mono);
      color: #e0e7ff;
      transition: transform 0.3s var(--ease-spring), background 0.3s ease, border-color 0.3s ease;
    }

    .btn-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
    }

    .btn-arrow {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      color: var(--text-muted);
      transition: transform 0.3s var(--ease-spring), color 0.3s ease;
    }

    /* Эффекты наведения только для устройств с мышью (не залипают на телефонах) */
    @media (hover: hover) and (pointer: fine) {
      .nav-btn:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.22);
        box-shadow: 0 14px 28px -10px var(--accent-glow);
      }

      .nav-btn:hover::before {
        opacity: 0.12;
      }

      .nav-btn:hover .btn-num {
        transform: scale(1.06);
        background: var(--accent-gradient);
        border-color: transparent;
        color: #ffffff;
      }

      .nav-btn:hover .btn-arrow {
        transform: translateX(4px);
        color: #ffffff;
      }
    }

    /* Адаптация под мобильные экраны */
    @media (max-width: 520px) {
      header {
        padding: 14px 16px;
      }

      main {
        padding: 24px 14px 40px;
      }

      .hero {
        margin-bottom: 24px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .hero p {
        font-size: 15px;
      }

      .menu-card {
        padding: 20px 14px;
        border-radius: 20px;
      }

      .card-label {
        margin-bottom: 18px;
      }

      .buttons-grid {
        gap: 10px;
      }

      .nav-btn {
        padding: 13px 14px;
        border-radius: 14px;
        gap: 12px;
      }

      .btn-left {
        gap: 12px;
      }

      .btn-num {
        width: 38px;
        height: 38px;
        font-size: 17px;
        border-radius: 10px;
      }

      .btn-title {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

        <a href="dz8/dz9.html" class="nav-btn">

          </div>

        <a href="dz9/dz10.html" class="nav-btn">
